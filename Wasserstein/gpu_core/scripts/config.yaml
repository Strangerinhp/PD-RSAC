# ============================================================================
# PRODUCTION CONFIG - EV Fleet RL Training
# ============================================================================
# Optimized hyperparameters based on:
# - SAC paper (Haarnoja et al. 2018): https://arxiv.org/abs/1812.05905
# - SAC Discrete (Christodoulou 2019): https://arxiv.org/abs/1910.07207
# - Stable Baselines3 Zoo tuned hyperparams
# - SpinningUp OpenAI recommendations
# ============================================================================

environment:
  num_vehicles: 1000
  num_hexes: 3985
  num_stations: 150

episode:
  duration_hours: 10.0
  step_duration_minutes: 5

# ============================================================================
# DATA SETTINGS
# ============================================================================
data:
  parquet_path: "data/nyc_full/trips_processed.parquet"
  trip_percentage: 0.2
  prefetch_episodes: 5
  start_date: "2009-01-01"
  target_h3_resolution: 8   # Coarsen res9 tiles down to res8 parents (~4k hex)
  max_hex_count: 4000       # Upper bound after coarsening to keep distances manageable

# ============================================================================
# TRAINING HYPERPARAMETERS (CRITICAL!)
# ============================================================================
# References:
# - SB3 Zoo SAC: lr=7.3e-4, batch=256, tau=0.02, gamma=0.98-0.99
# - SpinningUp SAC: lr=3e-4, batch=256, polyak=0.995, gamma=0.99
# - For discrete: slightly lower lr, higher entropy for exploration
# ============================================================================
training:
  total_episodes: 500
  
  # Batch size: 256 is standard, larger for more stable gradients
  # Reference: SB3 uses 256 for most tasks
  batch_size: 256
  
  # Episode batch for parallel collection
  episode_batch_size: 4
  
  # Learning rates - CRITICAL!
  # Lower for discrete SAC to prevent instability
  # GCN has 43.9M params → need LOWER LR than standard SAC
  learning_rate:
    actor: 5.0e-5     # Reduced from 3e-4 for large GCN network
    critic: 1.0e-4     # Keep higher for faster value learning
    alpha: 5.0e-5     # Auto-tuning rate for entropy
  
  # Discount factor
  # 0.99 for long-horizon tasks (standard)
  # 0.98 for shorter effective horizons (SB3 PyBullet)
  # For 120 steps/episode: 0.99^120 ≈ 0.30, still reasonable
  gamma: 0.98
  
  # Soft update coefficient (Polyak averaging)
  # tau=0.005 (SAC paper) or tau=0.02 (SB3 tuned)
  # Larger tau = faster target updates, less stable
  # Smaller tau = slower convergence, more stable
  # 0.002: balanced — target catches up by ~25 episodes (stable with tiny buffer)
  tau: 0.002
  
  # Warmup: random actions before training
  # 10k-25k steps recommended for complex envs
  warmup_steps: 10000
  
  # Update frequency
  # update_every=1: update after every step (standard)
  # Higher values = faster but less sample-efficient
  update_every: 1
  
  # Gradient clipping - prevents exploding gradients
  # Lower for large GCN to be extra conservative and prevent learning shocks
  max_grad_norm: 0.2
  
  # Reposition head auxiliary loss weight (demand-based supervision)
  # Without this, the reposition head has ZERO gradient from SAC loss
  repos_aux_weight: 0.1
  
  # Mixed precision for speed (requires modern GPU)
  mixed_precision: true
  compile_model: false  # torch.compile can cause issues

# ============================================================================
# REPLAY BUFFER
# ============================================================================
# Prioritized Experience Replay (PER) improves sample efficiency
# Reference: Schaul et al. 2016
# ============================================================================
replay_buffer:
  # Buffer size: 1M is standard, 300k-500k for memory constraints
  # For 1000 vehicles * 120 steps = 120k transitions/episode
  # 500k ≈ 4 episodes of data
  capacity: 500000
  
  # PER settings
  prioritized: true
  alpha: 0.6           # Priority exponent (0=uniform, 1=full priority)
  beta_start: 0.4      # Importance sampling start
  beta_end: 1.0        # Importance sampling end
  beta_annealing_steps: 200000

# ============================================================================
# REWARD FUNCTION (Paper Eq. 8)
# ============================================================================
# r_t = trip_revenue - driving_cost - electricity_cost - wait_penalty - drop_penalty
# ============================================================================
reward:
  # Driving cost per km (gas/maintenance equivalent)
  driving_cost_per_km: 0.30
  
  # Electricity cost (charging)
  electricity_cost_per_kwh: 0.18
  
  # Wait penalty - encourages quick service
  # Small value to avoid over-penalizing
  wait_penalty_per_step: 0.01
  
  # Drop penalty - don't over-penalize (agent can't serve all)
  drop_penalty_per_order: 0.05
  
  # Reward scaling (divide raw reward)
  scale_factor: 100.0
  
  # Max wait before drop (6 steps = 30 min)
  max_wait_steps: 6
  
  # Bonus per trip served to encourage serving
  serve_bonus: 5.0   # Serve=15.9 raw vs repos=9.7; repos only wins at demand>54 (hot hexes only)
  
  # Penalties for suboptimal actions (kept light so base reward dominates)
  reposition_penalty: 0.5        # Flat cost per repos action; arrival bonus still rewards good spatial decisions
  # idle_penalty removed - IDLE action removed from policy (action space now 3: SERVE/CHARGE/REPOS)
  serve_fail_penalty: 0.1        # Reduced: 900 fails × 0.8 = 720/step penalty drowns all other signals; code fixes handle root cause
  high_soc_charge_penalty: 0.5   # Discourage charging when SOC already high
  very_high_soc_charge_penalty: 0.5  # Stronger penalty when charging above 80% (CHARGE=1 in new scheme)
  
  # Demand-aware repositioning bonus
  reposition_success_bonus: 0.3    # Arrival bonus: repos net (9.7) < serve (10.9) for median demand; wins only at demand>35
  reposition_nearby_decay: 0.3     # 30% credit for nearby hexes (tighter spatial precision than 0.5)
  reposition_action_bonus: 0.0     # Flat action bonus disabled
  reposition_dispatch_bonus: 0.0            # Disabled: demand always exceeds cap so this was just a flat 1.5/vehicle bonus
  reposition_dispatch_demand_cap: 25.0      # Kept for reference (dispatch bonus is off)
  reposition_dispatch_per_vehicle_cap: 1.5  # Kept for reference (dispatch bonus is off)

# ============================================================================
# PHYSICS PARAMETERS
# ============================================================================
physics:
  energy_per_km: 0.2       # kWh/km (typical EV: 0.15-0.25)
  avg_speed_kmh: 25.0      # NYC average speed (reduced for realism)
  max_soc: 100.0
  min_soc_reserve: 10.0    # Minimum SOC before forced charge
  charge_power_kw: 200.0   # Ultra-fast DC charging (200 kW for faster turnaround)

# ============================================================================
# VEHICLE SETTINGS
# ============================================================================
vehicle:
  initial_soc: 80.0
  soc_low_threshold: 20.0   # Warning threshold - match min_soc_reserve
  soc_med_threshold: 50.0   # Medium SOC
  soc_charge_interrupt_threshold: 90.0  # Can interrupt charge at 90%

# ============================================================================
# CHARGING STATIONS
# ============================================================================
# With 1000 vehicles, need enough ports for ~20-30% charging at once
# 150 stations * 10 ports = 1500 ports (enough for 150% of fleet)
# ============================================================================
station:
  max_power: 200.0           # kW per port (matches physics.charge_power_kw)
  electricity_price: 0.18
  price_per_kwh: 0.18
  num_ports: 10              # Ports per station (150 stations * 10 = 1500 total)

# ============================================================================
# NETWORK ARCHITECTURE
# ============================================================================
# Reference: SB3 uses [400, 300] for complex control tasks
# For discrete SAC: [256, 256] often sufficient
# ============================================================================
network:
  # Actor/Critic hidden dims
  # Larger = more capacity, slower, potential overfitting
  actor_hidden_dims: [128, 128]
  critic_hidden_dims: [256, 256]
  
  # Hex embedding dimension
  hex_embedding_dim: 64
  
  # GCN settings (if using GCN)
  gcn_hidden_dims: [128, 128]
  gcn_output_dim: 64
  
  # Dropout for regularization
  dropout: 0.1

# ============================================================================
# ENTROPY SETTINGS (for SAC)
# ============================================================================
# Critical for exploration/exploitation balance
# ============================================================================
entropy:
  # Auto-tune entropy coefficient
  auto_alpha: true
  
  # Initial alpha (starting exploration level)
  initial_alpha: 0.5
  
  # Target entropy for discrete actions
  # Action space: SERVE=0, CHARGE=1, REPOSITION=2 (IDLE removed)
  # target = ratio × log(num_actions) = ratio × log(3) = ratio × 1.099
  # With ratio=0.5: target = -0.55 nats (min entropy allowed for 3-action policy)
  # 0.5: forces ~73% max on best action, healthy for a fleet policy still learning
  target_entropy_ratio: 0.5  # Fleet policy should hedge SERVE/CHARGE/REPOS until it learns which is best
  
  # Minimum alpha - prevents entropy collapse
  # Higher value ensures continued exploration
  # For 4 actions: min ~0.1-0.15 recommended for long training
  min_alpha: 0.15   # Floor for entropy coefficient (raised from 0.05: negligible at 4 actions, need 0.15 for 3)
  max_alpha: 1.2    # Raised: 0.65 was not enough to break out of SERVE-collapse when buffer is poisoned

# ============================================================================
# DISTRIBUTED TRAINING
# ============================================================================
distributed:
  enabled: false
  backend: "nccl"
  world_size: 1
  gpus: null

# ============================================================================
# CHECKPOINTING
# ============================================================================
checkpoint:
  checkpoint_dir: "checkpoints/production"
  save_interval: 100       # Save every N episodes
  save_best: true          # Save best model
  keep_last: 5             # Keep last N checkpoints

# ============================================================================
# LOGGING
# ============================================================================
logging:
  log_dir: "logs/production"
  log_interval: 10
  use_tensorboard: true
  use_wandb: false
  wandb_project: "ev-fleet-rl"

# ============================================================================
# DEBUG
# ============================================================================
debug:
  enabled: false
  log_gradients: false
  log_activations: false
  profile: false
  seed: 42
